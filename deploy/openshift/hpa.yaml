apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgetdm
  labels:
    app.kubernetes.io/name: forgetdm
spec:
  # Dynamic scaling: spin up parallel processing pods under load, scale back down when idle
  # (RFP §3.1.2 "scale dynamically ... to handle peak data volumes").
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgetdm
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
