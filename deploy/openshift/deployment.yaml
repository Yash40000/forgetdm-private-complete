apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgetdm
  labels:
    app.kubernetes.io/name: forgetdm
    app.kubernetes.io/component: tdm-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forgetdm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgetdm
        app.kubernetes.io/component: tdm-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # OpenShift assigns an arbitrary UID in group 0 and the fsGroup from the namespace range;
      # do not pin runAsUser/fsGroup here (restricted-v2 SCC). On plain Kubernetes, add
      # `fsGroup: 1001` so the non-root UID can write the PVC.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgetdm
          image: image-registry.openshift-image-registry.svc:5000/forgetdm/forgetdm:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
            - name: management
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: forgetdm-config
            - secretRef:
                name: forgetdm-secrets
          # Boot can take ~30-45s (Flyway + JPA); the startup probe protects liveness during that.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      # Give in-flight snapshots/masking time to drain (matches server.shutdown: graceful).
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgetdm-data
        - name: tmp
          emptyDir: {}
