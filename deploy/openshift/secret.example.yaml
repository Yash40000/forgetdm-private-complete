# Template only — do NOT commit real secrets. Create the real Secret out-of-band, e.g.:
#   oc create secret generic forgetdm-secrets \
#     --from-literal=FORGETDM_DB_USER=forgetdm \
#     --from-literal=FORGETDM_DB_PASS='***' \
#     --from-literal=FORGETDM_VAULT_TOKEN='***' \
#     --from-literal=FORGETDM_MASKING_SECRET='***'   # only used if Vault is disabled
# Prefer sourcing FORGETDM_MASKING_SECRET from HashiCorp Vault (see configmap) rather than here.
apiVersion: v1
kind: Secret
metadata:
  name: forgetdm-secrets
  labels:
    app.kubernetes.io/name: forgetdm
type: Opaque
stringData:
  FORGETDM_DB_USER: "forgetdm"
  FORGETDM_DB_PASS: "CHANGE_ME"
  # Vault token for the masking-key custody path (least-privilege policy on secret/forgetdm/*).
  FORGETDM_VAULT_TOKEN: "CHANGE_ME"
  # Fallback masking secret — ONLY used when FORGETDM_VAULT_ENABLED=false.
  FORGETDM_MASKING_SECRET: "CHANGE_ME"
